<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Isla de las Palabras</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: un mapa de 10 islas; al tocar una se abre su panel con lección dibujada y juegos de toque. */
:root{
  --bg:#e9f3ff; --card:#ffffff; --ink:#1b2a4e; --muted:#4d5d86; --line:#c7d8f3; --pic:#f0f6ff;
  --ok:#17824a; --okbg:#ddf5e7; --bad:#c73a30; --badbg:#fde3e0; --star:#ffb400;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a35; --card:#192650; --ink:#eef3ff; --muted:#aebbe0; --line:#344778; --pic:#e8f1ff;
    --ok:#6fe3a6; --okbg:#133f2a; --bad:#ff9288; --badbg:#4b1e1b; --star:#ffc933; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a35; --card:#192650; --ink:#eef3ff; --muted:#aebbe0; --line:#344778; --pic:#e8f1ff;
  --ok:#6fe3a6; --okbg:#133f2a; --bad:#ff9288; --badbg:#4b1e1b; --star:#ffc933; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body); font-size:18px; line-height:1.5;
  padding-block:20px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:960px;margin-inline:auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--star);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin-bottom:20px}
.top h1{font-size:clamp(2rem,7vw,3.2rem);font-weight:800}
.top p{margin:4px 0 0;color:var(--muted);font-weight:700}
.starpill{display:flex;align-items:center;gap:8px;background:var(--card);border:3px solid var(--line);border-radius:999px;padding:6px 18px 6px 12px;font-family:var(--display);font-weight:800;font-size:1.7rem}
.starpill svg{width:34px;height:34px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.isle{background:var(--card);border:4px solid var(--ac);border-radius:24px;padding:14px;display:grid;gap:8px;justify-items:start;text-align:left;min-width:0;transition:transform .15s}
.isle:hover{transform:translateY(-3px)}
.isle .ico{width:84px;height:84px;border-radius:50%;background:var(--pic);display:grid;place-items:center;overflow:hidden}
.isle .ico svg{width:78px;height:78px}
.icotxt{font-family:var(--display);font-weight:800;font-size:1.9rem;color:#1b2a4e}
.isle .nm{font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1.1}
.bar{display:block;width:100%;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px}
.cnt{font-size:.9rem;font-weight:800;color:var(--muted)}
.band{background:var(--ac);color:#fff;border-radius:24px 24px 0 0;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.band h2{font-size:clamp(1.6rem,5vw,2.3rem);font-weight:800}
.back{background:rgba(255,255,255,.2);border:3px solid #fff;color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:1rem}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:18px}
.band + .card{border-radius:0 0 22px 22px;border-top:0}
.lesson h3,.play h3{font-size:1.5rem;margin-bottom:8px}
.lesson{margin-bottom:16px}
.lesson p{margin:8px 0}
.tip{background:var(--pic);color:#1b2a4e;border-radius:14px;padding:10px 14px;font-weight:700}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin:12px 0}
.chips.wide{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.chip{margin:0;background:var(--pic);color:#1b2a4e;border-radius:18px;padding:10px;display:grid;gap:4px;justify-items:center;text-align:center;min-width:0}
.chip figcaption{display:grid;line-height:1.2}
.chip figcaption b{font-family:var(--display);font-size:1.25rem}
.chip figcaption span{font-size:.9rem;font-weight:700;color:#4d5d86}
.pic{width:100%;max-width:110px;height:auto;display:block}
.pic.wide{max-width:150px}
.scene{width:100%;height:auto;border-radius:12px;display:block}
.sign{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;color:#c85f00;padding:6px 0}
.sent{font-family:var(--display);font-size:2rem;font-weight:800}
.sent mark{background:#ffe08a;color:#1b2a4e;border-radius:8px;padding:0 6px}
.lesson ul,.lesson ol{margin:8px 0;padding-left:24px}
.lesson li{margin:4px 0}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-weight:800;font-size:.95rem;margin-bottom:10px}
.intro{background:var(--pic);color:#1b2a4e;border-radius:16px;padding:12px 16px;margin-bottom:12px;font-size:1.15rem;font-weight:700}
.stage{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:12px}
.stage .pic{max-width:150px;background:var(--pic);border-radius:20px;padding:6px}
.prompt{font-size:1.4rem;font-weight:800;flex:1 1 220px;min-width:0}
.word{font-family:var(--display);font-size:2.4rem;font-weight:800;letter-spacing:.04em}
.word b{display:inline-block;min-width:1.1em;border-bottom:5px solid var(--star);text-align:center;color:transparent}
.say{background:transparent;border:3px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:800;font-size:.95rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:10px 0}
.opt,.tok{min-height:60px;font-size:1.3rem;font-weight:800;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:8px 16px;min-width:0;overflow-wrap:anywhere}
.opt:hover:not(:disabled),.tok:hover{border-color:var(--ac)}
.opt.good{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad);animation:shake .35s}
.opt:disabled{cursor:default}
.fb{min-height:2.2em;font-weight:800;font-size:1.15rem;margin:6px 0}
.fb.good{color:var(--ok)} .fb.bad{color:var(--bad)}
.go{background:var(--ac);color:#fff;border:0;border-radius:999px;min-height:56px;padding:10px 28px;font-weight:800;font-size:1.25rem;font-family:var(--display)}
.go[hidden]{display:none}
.ghost{background:transparent;border:3px solid var(--line);border-radius:999px;min-height:48px;padding:6px 20px;font-weight:800;font-size:1rem}
.line{min-height:76px;border:3px dashed var(--line);border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.tok{min-height:52px}
.tok.in{background:var(--pic);color:#1b2a4e;border-color:var(--ac)}
.story{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:10px 0}
.scard{position:relative;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:8px;display:grid;gap:6px;text-align:left;min-width:0}
.scard.done{border-color:var(--ok)}
.scard.bad{animation:shake .35s;border-color:var(--bad)}
.scard .cap{font-weight:800;font-size:1rem}
.scard .num{position:absolute;top:-10px;left:-10px;width:40px;height:40px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.3rem}
.scard .part{font-family:var(--display);font-weight:800;color:var(--ok)}
.clap{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:10px 0}
.clapbtn{width:120px;height:120px;border-radius:50%;background:var(--ac);color:#fff;border:0;font-family:var(--display);font-weight:800;font-size:1.2rem}
.clapbtn:active{transform:scale(.93)}
.count{font-family:var(--display);font-weight:800;font-size:3.4rem;min-width:1.5em}
.syl{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.syl span{background:var(--okbg);color:var(--ok);border-radius:12px;padding:4px 14px;font-family:var(--display);font-weight:800;font-size:1.6rem}
.reveal{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:10px 0}
.end{text-align:left}
.end .big{font-family:var(--display);font-weight:800;font-size:2rem;display:flex;align-items:center;gap:10px}
.end .big svg{width:48px;height:48px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.foot{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted);font-weight:700;font-size:.95rem}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.pop{animation:pop .4s}
@media (prefers-reduced-motion: reduce){
  .opt.bad,.scard.bad,.pop{animation:none}
  .isle{transition:none}
}
</style>

</head>

<div class="wrap">
  <header class="top">

      <p>Comunicación, 2.º de primaria. Toca una isla y juega.</p>
    </div>
    <div class="starpill" title="Mis estrellas"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#s-star" width="24" height="24"/></svg><span id="stars">0</span></div>
  </header>
  <main>
    <section id="map" class="map" aria-label="Mapa de islas"></section>

<script>
(function(){
  var KEY='isla-palabras-v1';
  var store={solved:new Set(),stars:new Set()};
  var cur=null;
  var SK='#f2c6a0', LN='#243b6b';

  function $(s){return document.querySelector(s)}
  function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||'{}');(d.solved||[]).forEach(function(k){store.solved.add(k)});(d.stars||[]).forEach(function(k){store.stars.add(k)});}catch(e){}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({solved:Array.from(store.solved),stars:Array.from(store.stars)}));}catch(e){}}
  function strip(h){return h.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}
  function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t}return b}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}

  /* ---------- dibujos ---------- */
  function pic(id,c,alt,size){
    var st=c?' style="--c:'+c+'"':'';
    var s=size||100, o=(100-s)/2;
    return '<svg class="pic" viewBox="0 0 100 100" role="img" aria-label="'+(alt||id)+'"><use href="#s-'+id+'" x="'+o+'" y="'+(100-s>0?100-s-o*0.2:0)+'" width="'+s+'" height="'+s+'"'+st+'/></svg>';
  }
  function g(inner){return '<g stroke="'+LN+'" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">'+inner+'</g>'}
  function head(x,y){return '<circle cx="'+x+'" cy="'+y+'" r="11" fill="'+SK+'" stroke="'+LN+'" stroke-width="3"/>'}
  var FIG={
    run:g('<path d="M64 34L56 62"/><path d="M62 42L82 50M60 42L42 52"/><path d="M56 62L76 78L90 72M56 62L40 80L26 76"/>')+head(66,22)+'<path d="M8 40h16M4 52h14M10 64h14" stroke="#9db4e6" stroke-width="4" stroke-linecap="round"/>',
    jump:'<ellipse cx="60" cy="94" rx="22" ry="4" fill="#9db4e6" opacity=".6"/>'+g('<path d="M60 32V62"/><path d="M60 40L38 16M60 40L82 16"/><path d="M60 62L44 78L50 88M60 62L76 78L70 88"/>')+head(60,20),

  /* ---------- progreso ---------- */
  function itemCount(r){return r.t==='quiz'?r.qs.length:r.t==='build'?r.tasks.length:r.t==='clap'?r.words.length:r.t==='reveal'?r.riddles.length:1}
  function total(isl){return isl.rounds.reduce(function(n,r){return n+itemCount(r)},0)}
  function key(isl,ri,qi){return isl.id+':'+ri+':'+qi}
  function doneCount(isl){var n=0;isl.rounds.forEach(function(r,ri){for(var q=0;q<itemCount(r);q++){if(store.solved.has(key(isl,ri,q)))n++}});return n}
  function starsOf(isl){var n=0;isl.rounds.forEach(function(r,ri){for(var q=0;q<itemCount(r);q++){if(store.stars.has(key(isl,ri,q)))n++}});return n}
  function mark(isl,ri,qi,first){var k=key(isl,ri,qi);store.solved.add(k);if(first)store.stars.add(k);save();updateStars(first)}
  function updateStars(pop){var el=$('#stars');el.textContent=store.stars.size;if(pop){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}}

  /* ---------- voz ---------- */
  var canSpeak=false;try{canSpeak=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window)}catch(e){}
  function speak(t){try{var u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.85;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}catch(e){}}
  function sayBtn(){return canSpeak?'<button type="button" class="say" data-say>Escuchar</button>':''}

  /* ---------- mapa ---------- */
  function renderMap(){
    $('#map').innerHTML=ISL.map(function(isl,i){
      var t=total(isl),d=doneCount(isl),pct=Math.round(d/t*100);
      var ico=isl.icon.txt?'<span class="icotxt">'+isl.icon.txt+'</span>':pic(isl.icon.id,isl.icon.c,'');
      return '<button type="button" class="isle" style="--ac:'+isl.ac+'" data-i="'+i+'"><span class="ico">'+ico+'</span><span class="nm">'+isl.name+'</span><span class="bar"><i style="width:'+pct+'%"></i></span><span class="cnt">'+d+' de '+t+(d===t?' · lista':'')+'</span></button>';
    }).join('');
  }

  function showMap(){
    cur=null;$('#panel').hidden=true;$('#map').hidden=false;renderMap();
    try{window.scrollTo(0,0)}catch(e){}
  }

  function openIsland(i,round){
    var isl=ISL[i];cur={i:i,r:round||0};
    $('#map').hidden=true;
    var p=$('#panel');p.hidden=false;
    p.innerHTML='<div class="band" style="--ac:'+isl.ac+'"><button type="button" class="back" id="back">← Mapa</button><h2>'+isl.name+'</h2></div>'+
      '<section class="card lesson"><h3>Aprende</h3>'+isl.lesson+'</section>'+
      '<section class="card play" id="play" style="--ac:'+isl.ac+'"></section>';
    $('#back').onclick=showMap;
    startRound();
    try{window.scrollTo(0,0)}catch(e){}
  }

  function startRound(){
    var isl=ISL[cur.i],R=isl.rounds[cur.r];
    if(R.t==='quiz')renderQuiz(0);
    else if(R.t==='build')renderBuild(0);
    else if(R.t==='order')renderOrder();
    else if(R.t==='clap')renderClap(0);
    else if(R.t==='reveal')renderReveal(0);
  }
  function nextRound(){
    var isl=ISL[cur.i];cur.r++;
    if(cur.r<isl.rounds.length)startRound();else finish();
  }
  function meta(label,qi,n){
    var isl=ISL[cur.i];
    return '<div class="meta"><span>Juego '+(cur.r+1)+' de '+isl.rounds.length+'</span><span>'+label+' '+(qi+1)+' de '+n+'</span></div>';
  }
  function bindSay(text){var b=document.querySelector('#play [data-say]');if(b)b.onclick=function(){speak(text)}}
  function fbSet(kind,msg){var f=$('#fb');f.className='fb '+kind;f.textContent=msg}

  /* ---------- quiz ---------- */
  function renderQuiz(qi){
    var isl=ISL[cur.i],ri=cur.r,R=isl.rounds[ri],q=R.qs[qi],n=R.qs.length;
    var opts=shuffle(q.o.map(function(t,i){return {t:t,ok:i===q.a}}));
    var mistakes=0,answered=false;
    var play=$('#play');
    play.innerHTML=meta('Pregunta',qi,n)+
      (R.intro?'<div class="intro"><div class="stage">'+(R.introPic||'')+'<div class="prompt" style="font-weight:700">'+R.intro+'</div></div>'+(canSpeak?'<button type="button" class="say" data-say2>Escuchar la lectura</button>':'')+'</div>':'')+
      '<div class="stage">'+(q.p||'')+'<div class="prompt">'+q.q+'</div>'+sayBtn()+'</div>'+
      '<div class="opts">'+opts.map(function(o,i){return '<button type="button" class="opt" data-k="'+i+'">'+o.t+'</button>'}).join('')+'</div>'+
      '<div class="fb" id="fb" role="status" aria-live="polite"></div>'+
      '<button type="button" class="go" id="next" hidden>'+(qi+1<n?'Siguiente':'Seguir')+'</button>';
    bindSay(q.say||strip(q.q));
    var s2=document.querySelector('#play [data-say2]');if(s2)s2.onclick=function(){speak(R.intro)};
    play.querySelectorAll('.opt').forEach(function(b){
      b.onclick=function(){
        if(answered)return;
        var o=opts[+b.dataset.k];
        if(o.ok){
          answered=true;b.classList.add('good');
          play.querySelectorAll('.opt').forEach(function(x){x.disabled=true});
          mark(isl,ri,qi,mistakes===0);
          fbSet('good',pick(['¡Muy bien!','¡Excelente!','¡Lo lograste!','¡Genial!'])+(mistakes===0?' Ganaste una estrella.':''));
          var nx=$('#next');nx.hidden=false;nx.onclick=function(){if(qi+1<n)renderQuiz(qi+1);else nextRound()};
          nx.focus();
        }else{
          mistakes++;b.classList.add('bad');b.disabled=true;
          fbSet('bad','Casi. '+(q.h||'Inténtalo otra vez.'));
        }
      };
    });
  }

  /* ---------- armar oración ---------- */
  function renderBuild(ti){
    var isl=ISL[cur.i],ri=cur.r,R=isl.rounds[ri],T=R.tasks[ti],n=R.tasks.length;
    var mistakes=0,finished=false;
    var bank,line=[];
    function newBank(){
      var items=T.w.map(function(w,i){return {w:w,i:i}});
      var s=shuffle(items),guard=0;
      while(s.map(function(x){return x.w}).join(' ')===T.w.join(' ')&&guard++<10)s=shuffle(items);
      bank=s;line=[];
    }
    newBank();
    var play=$('#play');
    play.innerHTML=meta('Oración',ti,n)+'<div class="stage">'+(T.p||'')+'<div class="prompt">Toca las palabras en orden para armar la oración.</div></div>'+
      '<div class="line" id="line" aria-label="Tu oración"></div><div class="bank" id="bank"></div>'+
      '<div class="fb" id="fb" role="status" aria-live="polite"></div><button type="button" class="go" id="next" hidden>'+(ti+1<n?'Siguiente':'Seguir')+'</button>';
    function draw(){
      $('#line').innerHTML=line.map(function(x,k){return '<button type="button" class="tok in" data-l="'+k+'">'+x.w+'</button>'}).join('')||'<span style="color:var(--muted);font-weight:700">Aquí va tu oración</span>';
      $('#bank').innerHTML=bank.map(function(x,k){return '<button type="button" class="tok" data-b="'+k+'">'+x.w+'</button>'}).join('');
      if(finished)return;
      $('#line').querySelectorAll('[data-l]').forEach(function(b){b.onclick=function(){var x=line.splice(+b.dataset.l,1)[0];bank.push(x);draw()}});
      $('#bank').querySelectorAll('[data-b]').forEach(function(b){b.onclick=function(){var x=bank.splice(+b.dataset.b,1)[0];line.push(x);draw();check()}});
    }
    function check(){
      if(bank.length)return;
      var ok=line.map(function(x){return x.w}).join(' ')===T.w.join(' ');
      if(ok){
        finished=true;draw();
        mark(isl,ri,ti,mistakes===0);
        fbSet('good','¡Muy bien! Empieza con mayúscula y termina con punto.'+(mistakes===0?' Ganaste una estrella.':''));
        var nx=$('#next');nx.hidden=false;nx.onclick=function(){if(ti+1<n)renderBuild(ti+1);else nextRound()};nx.focus();
      }else{
        mistakes++;fbSet('bad','Casi. Revisa el orden y prueba otra vez.');
        setTimeout(function(){if(finished)return;bank=bank.concat(line);line=[];draw()},900);
      }
    }
    draw();
  }

  /* ---------- ordenar el cuento ---------- */
  function renderOrder(){
    var isl=ISL[cur.i],ri=cur.r,R=isl.rounds[ri];
    var order=shuffle([0,1,2]),next=0,mistakes=0,placed={};
    var play=$('#play');
    play.innerHTML='<div class="meta"><span>Juego '+(ri+1)+' de '+isl.rounds.length+'</span><span>Cuento</span></div>'+
      '<div class="prompt" style="margin-bottom:8px">Toca los dibujos en el orden del cuento: primero el inicio, luego el nudo y al final el desenlace.</div>'+
      '<div class="story" id="story">'+order.map(function(idx){return '<button type="button" class="scard" data-s="'+idx+'">'+scene(idx)+'<span class="cap">'+R.caps[idx]+'</span><span class="part" data-part="'+idx+'"></span></button>'}).join('')+'</div>'+
      '<div class="fb" id="fb" role="status" aria-live="polite"></div><button type="button" class="go" id="next" hidden>Seguir</button>';
    play.querySelectorAll('.scard').forEach(function(c){
      c.onclick=function(){
        var idx=+c.dataset.s;if(placed[idx])return;
        if(idx===next){
          placed[idx]=true;c.classList.add('done');
          var nm=document.createElement('span');nm.className='num';nm.textContent=String(next+1);c.appendChild(nm);
          c.querySelector('[data-part]').textContent=R.parts[idx];
          next++;
          if(next===3){
            mark(isl,ri,0,mistakes===0);
            fbSet('good','¡Muy bien! Inicio, nudo y desenlace.'+(mistakes===0?' Ganaste una estrella.':''));
            var nx=$('#next');nx.hidden=false;nx.onclick=nextRound;nx.focus();
          }else fbSet('good','Bien. Ahora toca el que sigue.');
        }else{
          mistakes++;c.classList.remove('bad');void c.offsetWidth;c.classList.add('bad');
          fbSet('bad',next===0?'Ese no es el principio. ¿Cómo empieza el cuento?':'Ese va después. ¿Qué pasa ahora?');
        }
      };
    });
  }

  /* ---------- aplaudir sílabas ---------- */
  function renderClap(wi){
    var isl=ISL[cur.i],ri=cur.r,R=isl.rounds[ri],W=R.words[wi],n=R.words.length;
    var count=0,mistakes=0,fin=false;
    var play=$('#play');
    play.innerHTML=meta('Palabra',wi,n)+'<div class="prompt" style="margin-bottom:6px">Aplaude cada golpe de voz de la palabra. Di la palabra despacio y toca el botón por cada sílaba.</div>'+
      '<div class="clap"><span class="word">'+W.w+'</span>'+sayBtn()+'</div>'+
      '<div class="clap"><button type="button" class="clapbtn" id="clap">Aplaudir</button><span class="count" id="count" aria-live="polite">0</span>'+
      '<button type="button" class="go" id="check">Listo</button><button type="button" class="ghost" id="zero">Empezar de nuevo</button></div>'+
      '<div class="syl" id="syl"></div><div class="fb" id="fb" role="status" aria-live="polite"></div><button type="button" class="go" id="next" hidden>'+(wi+1<n?'Siguiente':'Seguir')+'</button>';
    bindSay(W.w);
    $('#clap').onclick=function(){if(fin)return;count++;$('#count').textContent=count};
    $('#zero').onclick=function(){if(fin)return;count=0;$('#count').textContent=0;fbSet('','')};
    $('#check').onclick=function(){
      if(fin)return;
      if(count===W.n){
        fin=true;mark(isl,ri,wi,mistakes===0);
        $('#syl').innerHTML=W.s.map(function(s){return '<span>'+s+'</span>'}).join('');
        fbSet('good','¡Muy bien! '+W.w+' tiene '+W.n+(W.n===1?' sílaba.':' sílabas.')+(mistakes===0?' Ganaste una estrella.':''));
        var nx=$('#next');nx.hidden=false;nx.onclick=function(){if(wi+1<n)renderClap(wi+1);else nextRound()};nx.focus();
      }else{
        mistakes++;count=0;$('#count').textContent=0;
        fbSet('bad','Casi. Di la palabra despacio y aplaude otra vez.');
      }
    };
  }

  /* ---------- adivinanzas ---------- */
  function renderReveal(ri2){
    var isl=ISL[cur.i],ri=cur.r,R=isl.rounds[ri],D=R.riddles[ri2],n=R.riddles.length;
    var play=$('#play');
    play.innerHTML=meta('Adivinanza',ri2,n)+'<div class="stage"><div class="prompt">'+D.t+'</div>'+sayBtn()+'</div>'+
      '<div class="row"><button type="button" class="go" id="show">Ver la respuesta</button></div>'+
      '<div class="reveal" id="ans" hidden>'+D.p+'<div class="prompt" style="color:var(--ok)">'+D.a+'</div></div>'+
      '<div class="fb" id="fb" role="status" aria-live="polite"></div><button type="button" class="go" id="next" hidden>'+(ri2+1<n?'Siguiente':'Seguir')+'</button>';
    bindSay(D.t);
    $('#show').onclick=function(){
      $('#ans').hidden=false;$('#show').hidden=true;
      mark(isl,ri,ri2,true);
      fbSet('good','Piensa primero y luego mira. Ganaste una estrella.');
      var nx=$('#next');nx.hidden=false;nx.onclick=function(){if(ri2+1<n)renderReveal(ri2+1);else nextRound()};nx.focus();
    };
  }

  /* ---------- final de isla ---------- */
  function finish(){
    var isl=ISL[cur.i];
    var s=starsOf(isl),t=total(isl),d=doneCount(isl);
    var idx=cur.i,nextI=idx+1<ISL.length?idx+1:null;
    var play=$('#play');
    play.innerHTML='<div class="end"><div class="big"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#s-star" width="24" height="24"/></svg>'+(d===t?'¡Isla completa!':'¡Terminaste!')+'</div>'+
      '<p>Tienes <b>'+s+' de '+t+'</b> estrellas en esta isla.'+(s<t?' Puedes jugar otra vez para conseguir las que faltan.':' ¡Las ganaste todas!')+'</p>'+
      '<div class="row"><button type="button" class="go" id="map2">Volver al mapa</button>'+(nextI!==null?'<button type="button" class="ghost" id="nxt">Ir a '+ISL[nextI].name+'</button>':'')+'<button type="button" class="ghost" id="again">Jugar otra vez</button></div></div>';
    $('#map2').onclick=showMap;
    var nb=$('#nxt');if(nb)nb.onclick=function(){openIsland(nextI)};
    $('#again').onclick=function(){cur.r=0;startRound()};
  }

  /* ---------- arranque ---------- */
  $('#map').addEventListener('click',function(e){var b=e.target.closest('.isle');if(b)openIsland(+b.dataset.i)});
  var resetWrap=$('#resetwrap');
  function resetUI(){
    resetWrap.innerHTML='<button class="ghost" id="reset" type="button">Borrar mis estrellas</button>';
    $('#reset').onclick=askReset;
  }
  function askReset(){
    resetWrap.innerHTML='<span>¿Borrar todo el progreso?</span> <button class="ghost" id="yes" type="button">Sí, borrar</button> <button class="ghost" id="no" type="button">No</button>';
    $('#yes').onclick=function(){store.solved.clear();store.stars.clear();save();updateStars();resetUI();showMap()};
    $('#no').onclick=resetUI;
  }
  $('#reset').onclick=askReset;
  load();updateStars();renderMap();
})();
</script>
</body>
</html>
